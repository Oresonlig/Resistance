<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- 3.101.0 — Admin: sektionsåtkomst per konto. Spärr i tre lager: /section.js (Misc-åtkomst),
     admin.js (bara ADMIN_EMAIL, annars tillbaka till /misc/) och SERVERN: admin_list_access /
     admin_set_access svarar "not authorized" till alla andra (MK1\SQL_ADMIN_ACCESS.sql). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://qjmjqideqrgozexudaqr.supabase.co; base-uri 'self'; object-src 'none'; form-action 'self'; frame-src 'none'">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<title>Admin — The Chain</title>
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/landing.css?v=3.100.3">
<link rel="stylesheet" href="/misc/misc.css?v=2">
<link rel="stylesheet" href="/misc/admin/admin.css?v=3.101.0">
<script defer src="/vendor/supabase.js"></script>
<script defer src="/site.js?v=3.102.1"></script>
<script defer src="/section.js?v=3.100.3"></script>
<script defer src="/misc/admin/admin.js?v=3.101.0"></script>
</head>
<body>
<div class="tc" id="tc" data-screen="section" data-auth="in" data-section="misc" data-checking>
  <header class="tc-head">
    <a class="tc-mark" href="/">THE CHAIN</a>
    <div class="tc-acct">
      <span class="tc-avatar" aria-hidden="true" data-bind="initial"></span>
      <span class="tc-email" data-bind="email"></span>
      <button type="button" class="tc-link" data-action="sign-out">Sign out</button>
    </div>
  </header>
  <main class="tc-gate" data-section="misc" aria-labelledby="g-name">
    <div class="tc-fx" aria-hidden="true"></div>
    <div class="tc-gate-inner mx">
      <div class="tc-gate-copy">
        <a class="tc-back" href="/misc/">← Back to Misc</a>
        <p class="tc-kicker">04 · Misc</p>
        <h1 class="tc-name" id="g-name">Admin</h1>
        <p class="ad-lead">Section access per account. Tick what each account should have, then save.
          <span class="ad-open" data-bind="open"></span></p>
      </div>

      <p class="ad-msg" id="ad-load" role="status">Loading accounts…</p>
      <div class="ad-list" id="ad-list"></div>

      <div class="ad-bar" id="ad-bar" hidden>
        <p class="ad-msg" id="ad-status" role="status"></p>
        <button type="button" class="tc-submit ad-save" id="ad-save" disabled>Save changes</button>
      </div>
    </div>
  </main>
</div>
</body>
</html>
