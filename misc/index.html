<body>
<div class="tc" id="tc" data-screen="section" data-auth="in" data-section="misc" data-checking>
  <header class="tc-head">
    <a class="tc-mark" href="/">THE CHAIN</a>
    <div class="tc-acct">
      <span class="tc-avatar" aria-hidden="true" data-bind="initial"></span>
      <span class="tc-email" data-bind="email"></span>
      <button type="button" class="tc-link" data-action="sign-out">Sign out</button>
    </div>
  </header>
  <main class="tc-gate" data-section="misc" aria-labelledby="g-name">
    <div class="tc-fx" aria-hidden="true"></div>
    <div class="tc-gate-inner mx">
      <div class="tc-gate-copy">
        <a class="tc-back" href="/">← Back to main</a>
        <p class="tc-kicker">04</p>
        <h1 class="tc-name" id="g-name">Misc</h1>
        <p class="tc-desc" data-bind="desc"></p>
      </div>

      <!-- Rutnätet. Ny app = kopiera en <a class="mx-tile">.
           data-kind="open": href till appen, ingen download-attribut.
           data-kind="download": href till filen, INGET download-attribut (3.98.3: med det
           fastnade APK:n på 99 % på Android; GitHub skickar ändå Content-Disposition: attachment,
           samma som MK2-länken i /training/ som fungerar). -->
      <nav class="mx-grid" aria-label="Apps">
        <a class="mx-tile" data-kind="download"
           href="https://github.com/Oresonlig/BossmanConnect/releases/download/app-latest/bossmanconnect.apk">
          <span class="mx-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="8" height="12" rx="4"/><circle cx="6.5" cy="12" r="1.6"/><rect x="13.5" y="6" width="8" height="12" rx="4"/><circle cx="17.5" cy="12" r="1.6"/></svg>
          </span>
          <h2 class="mx-name">BossmanConnect</h2>
          <p class="mx-desc">One button that links the two Bose Revolve+ speakers, Ninja and Lantern, in party mode.</p>
          <p class="mx-note">Android. First install: allow your browser to install unknown apps. After that, tap Update inside the app.</p>
          <span class="mx-go">Download APK <span aria-hidden="true">↓</span></span>
        </a>
      </nav>
    </div>
  </main>
</div>
